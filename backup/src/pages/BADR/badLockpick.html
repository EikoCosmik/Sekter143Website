<pageSettings>
	title="The BAD"
	color="redElement badLockpick"
	id="BAD"
</pageSettings>


<section id="pageContent" class="verticalTabs">
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<div id="values">
		<select onchange="updateFormValues()" name="dificultyPreset" id="presets">
			<option value="b">Easiest</option>
			<option value="e">Easy</option>
			<option value="m">Medium</option>
			<option value="h">Hard</option>
			<option value="a">Harder</option>
			<option value="w">Why</option>
		</select>
		<button class="button" onclick="resetLock()">Reset</button>
	<div style="display: none;">
		<input type="number" value="1" id="allowed" />
		<input type="number" value="1" id="close" />
		<input type="number" value="1" id="picks" />
	</div>
	</div>
	<sktemplate
		type="simpleContent"
		title="BAD-Lockpick"
		text="This needs a massive rebuild. Probably my least favorite public BAD project. Its based of the Skyrim lockpick, it was a curiosity and it didn't quite work the way it should of. But its built, its here, maybe one day ill make a better functioning lockpick minigame."
	></sktemplate>
	<canvas id="pickCanvas" width="750" height="750"></canvas>
	<img style="display: none" id="bitSource" src="../../assets/images/BAD/BrassLockBit.png" />
	<img style="display: none" id="lockSource" src="../../assets/images/BAD/lock.png" />
	<img style="display: none" id="backSource" src="../../assets/images/BAD/backgroundLock.png" />
		<script>
		var debuggingCheat = false;

		var canvasCenterX = 375;
		var canvasCenterY = 370;
		var maxKeyLength = 200;
		var elementOffset = $("#pickCanvas").offset();

		var relativeX = 0;
		var relativeY = 0;
		var currentMousePos = { x: -1, y: -1 };
		var curMouseAngle = 0;
		var curMouseRadians = 0;

		var c = document.getElementById("pickCanvas");
		var ctx = c.getContext("2d");

		var unlockAngle = -0;

		var minUnlockAccuracy = 10;
		var maxUnlockAccuracy = 180;
		var remainingPicks = 999;

		var curPickAccuracy = 0;

		var allowedErr = minUnlockAccuracy;
		var closeErr = maxUnlockAccuracy;
		var allowedMin = unlockAngle - allowedErr;
		var allowedMax = unlockAngle + allowedErr;
		var closeMin = unlockAngle - closeErr;
		var closeMax = unlockAngle + closeErr;
		 
		var animationRunning = false;
		var resultBlockPerc = 0;
		var resultBlockFill = 0;
		var drawWin = false;
		var drawLoose = false;

		var allowedInput = $("#allowed");
		var closeInput = $("#close");
		var picksInput = $("#picks");


		startSim();

		function getRandomInt(min, max)
		{
			const minCeiled = Math.ceil(min);
			const maxFloored = Math.floor(max);
			return Math.floor(Math.random() * (maxFloored - minCeiled) + minCeiled);
		}

		function startSim()
		{
			animationRunning = false;
			drawWin = false;
			unlockAngle = -1 * (getRandomInt(1, 180));
			updateFormValues();
		}

		function resetLock()
		{
			animationRunning = false;
			drawWin = false;
			drawLoose = false;
			remainingPicks = picksInput.val();
			unlockAngle = -1 * (getRandomInt(1, 180));
			updateInternalValues();
		}

		function updateFormValues() 
		{
			var e = document.getElementById("presets");
			var value = e.value;
			
			switch (value)
			{
				case "b":
					allowedInput.val(40);
					closeInput.val(180);
					picksInput.val(99);
					break;
				case "e":
					allowedInput.val(20);
					closeInput.val(75);
					picksInput.val(25);
					break;
				case "m":
					allowedInput.val(10);
					closeInput.val(45);
					picksInput.val(10);
					break;
				case "h":
					allowedInput.val(5);
					closeInput.val(10);
					picksInput.val(10);
					break;
				case "a":
					allowedInput.val(2);
					closeInput.val(10);
					picksInput.val(5);
					break;
				case "w":
					allowedInput.val(1);
					closeInput.val(2);
					picksInput.val(2);
					break;
			}

			resetLock();
		}

		function updateInternalValues()
		{
			minUnlockAccuracy = allowedInput.val();
			maxUnlockAccuracy = closeInput.val();
			remainingPicks = picksInput.val();

			runLoop();
		}

		$(document).mousemove(function (event)
		{
			if (!animationRunning)
			{
				currentMousePos.x = event.pageX;
				currentMousePos.y = event.pageY;
				relativeX = event.pageX - elementOffset.left;
				relativeY = event.pageY - elementOffset.top;
			}
			
			calcPointMouseAngle();
			calcAccuracy();
		});

		function calcAccuracy()
		{
			allowedErr = minUnlockAccuracy;
			closeErr = maxUnlockAccuracy;
			
			allowedMin = parseInt(unlockAngle) - parseInt(allowedErr);
			allowedMax = parseInt(unlockAngle) + parseInt(allowedErr);
			closeMin = parseInt(unlockAngle) - parseInt(closeErr);
			closeMax = parseInt(unlockAngle) + parseInt(closeErr);
			if (curMouseAngle < allowedMin && curMouseAngle > closeMin)
			{
				curPickAccuracy = ((curMouseAngle - closeMin) / (allowedMin - closeMin));
			}
			else
			if (curMouseAngle > allowedMax && curMouseAngle < closeMax)
			{
				curPickAccuracy = ((curMouseAngle - closeMax) / (allowedMax - closeMax));
			}
			else
			if (curMouseAngle > allowedMin && curMouseAngle < allowedMax)
			{
				curPickAccuracy = 1;
			}
			else
			{
				curPickAccuracy = 0;
			}
		}

		function runLoop()
		{
			ctx.clearRect(0, 100, 750, 750);

			ctx.strokeStyle = "black";

			if (debuggingCheat)
			{
				ctx.beginPath();
				ctx.strokeStyle = "cyan";
				drawMaxLengthStroke(allowedMin * (Math.PI / 180));
				ctx.strokeStyle = "blue";
				drawMaxLengthStroke(allowedMax * (Math.PI / 180));
				ctx.strokeStyle = "red";
				drawMaxLengthStroke(closeMin * (Math.PI / 180));
				ctx.strokeStyle = "maroon";
				drawMaxLengthStroke(closeMax * (Math.PI / 180));
				ctx.closePath();
			}
			else
			{
				ctx.drawImage(document.getElementById("backSource"), 0, 0);
				if (drawWin)
				{
					ctx.drawImage(document.getElementById("bitSource"), 260, 25);
				}
				else
				{
					ctx.drawImage(document.getElementById("bitSource"), 260, 125);
				}

				ctx.drawImage(document.getElementById("lockSource"),0,0);
			}
			ctx.beginPath();
			ctx.fillStyle = "#0a0a0a";
			ctx.strokeStyle = "black";
			ctx.lineWidth = 25;
			ctx.rect(0, 0, 215, 55);
			ctx.stroke();
			ctx.fill();
			ctx.closePath();

			ctx.beginPath();
			ctx.fillStyle = "white";
			ctx.strokeStyle = "white";
			ctx.font = "50px Arial";
			ctx.fillText("Picks: " + remainingPicks, 5, 45);
			ctx.closePath();

			ctx.beginPath();
			ctx.fillStyle = "#0a0a0a";
			ctx.strokeStyle = "black";
			ctx.lineWidth = 25;
			ctx.rect(0, 600, 750, 150);
			ctx.stroke();
			ctx.fill();
			ctx.closePath();

			ctx.beginPath();
			ctx.strokeStyle = "white";
			ctx.rect(25, 625, 700, 100);
			ctx.lineWidth = 30;
			ctx.stroke();
			ctx.lineWidth = 20;
			ctx.strokeStyle = "#0a0a0a";
			ctx.stroke();
			ctx.fill();
			ctx.closePath();

			ctx.beginPath();
			ctx.fillStyle = "white";
			ctx.rect(25, 625, resultBlockFill, 100);
			ctx.fill();
			ctx.closePath();

			ctx.beginPath();
			ctx.strokeStyle = "black";
			ctx.lineWidth = 10;
			drawMaxLengthStroke(curMouseRadians);
			ctx.lineWidth = 2;
			ctx.strokeStyle = "grey";
			drawMaxLengthStroke(curMouseRadians);
			ctx.closePath();
			ctx.lineWidth = 1;

			if (drawLoose)
			{
				ctx.beginPath();
				ctx.fillStyle = "#ff0000aa";
				ctx.rect(0, 0, 750, 750);
				ctx.fill();
				ctx.closePath();
			}

			if (!drawWin && !drawLoose)
			{
				setTimeout(runLoop, 1);
			}
		}

		function drawMaxLengthStroke(angle)
		{
			var x1 = canvasCenterX, y1 = canvasCenterY;
			var deltaX = maxKeyLength * Math.cos(angle);
			var deltaY = maxKeyLength * Math.sin(angle);

			var NewX = x1 + deltaX;
			var NewY = y1 + deltaY;

			ctx.beginPath();
			ctx.moveTo(canvasCenterX, canvasCenterY);
			ctx.lineTo(NewX, NewY);
			ctx.stroke();
		}

		function calcPointMouseAngle()
		{
			var x1 = canvasCenterX, y1 = canvasCenterY;
			var x2 = relativeX, y2 = relativeY;
			var deltaX = x2 - x1;
			var deltaY = y2 - y1;
			var angleRadians = Math.atan2(deltaY, deltaX);
			if (angleRadians > 0 && angleRadians < 1.5)
			{
				angleRadians = 0;
			}
			else if (angleRadians > 0 && angleRadians > 1.5)
			{
				angleRadians = -Math.PI;
			}
			var angleDegrees = angleRadians * (180 / Math.PI);
			curMouseRadians = angleRadians;
			curMouseAngle = angleDegrees;
		}

		function runTest()
		{
			testableAccuracy = curPickAccuracy * 100;
			if (resultBlockPerc < testableAccuracy)
			{
				resultBlockPerc++;
				if (resultBlockPerc >= testableAccuracy)
				{
					resultBlockPerc = testableAccuracy;
				}
				resultBlockFill = resultBlockPerc * 7;
				setTimeout(runTest, 10);
			}
			else
			{
				if (resultBlockPerc == 100)
				{
					console.log("Win!");
					drawWin = true;
				}
				else
				{
					remainingPicks = remainingPicks - 1;
					animationRunning = false;

					if (remainingPicks <= 0)
					{
						drawLoose = true;
					}
				}
			}
		}

		window.addEventListener("keydown", checkKeyPressed, false);

		function checkKeyPressed(evt)
		{
			if (evt.keyCode == "32")
			{
				if (!animationRunning)
				{
					resultBlockPerc = 0;
					resultBlockFill = 0;
					animationRunning = true;
					runTest();
				}
			}
		}
	</script>
</section>
