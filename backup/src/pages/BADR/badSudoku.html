	<script>
		var theGridArr;
		var currentNum = 5;
		var setupKey = 1;

		function changeNum(newNum)
		{
			currentNum = newNum;

			if (newNum != 0)
			{
				$("#currentNum").html(newNum);
			}
			else
			{
				$("#currentNum").html("Clear");
			}
		}

		function updateCell(objID)
		{
			var idOne = objID.split("")[0];
			var idTwo = objID.split("")[1];

			if (!$("#" + objID).hasClass("nonInit"))
			{
				var currentHtml = $("#" + objID).html();
				var modHtml = currentHtml.substring(1, currentHtml.length);

				theGridArr[idOne][idTwo] = currentNum;
				$("#" + objID).html(currentNum + modHtml);

				runCheck(false);
			}			
		}

		function updateHint(objID)
		{
			$("#" + objID).html(currentNum);
		}

		setup();

		function setup()
		{
			theGridArr =
				[
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' '],
					[' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ', ' ']
				];

			$.each(theGridArr, function (index, value)
			{
				$.each(value, function (innerIndex, innerValue)
				{
					idVal = "#" + index + innerIndex;
					$(idVal).removeClass("nonInit");
				});
			});

			switch (setupKey)
			{
				case 1:
					var howManyStarters = 28;
					var looper = 0;
					while (looper < howManyStarters)
					{
						var idOne = getRandomInt(0, 9);
						var idTwo = getRandomInt(0, 9);
						var randomCellId = "#" + idOne + idTwo;
						var randomValue = getRandomInt(1, 10);
						theGridArr[idOne][idTwo] = randomValue;
						$(randomCellId).html(randomValue);
						$(randomCellId).addClass("nonInit");
						looper++;
					}
					break;
			}

			

			$.each(theGridArr, function (index, value)
			{
				$.each(value, function (innerIndex, innerValue)
				{
					idVal = "#" + index + innerIndex;

					if ($(idVal).hasClass("nonInit"))
					{
						$(idVal).html(
							innerValue +
							" <div class='onclickBox' onclick='updateCell(\"" + index + innerIndex + "\")'></div>"
						);
					}
					else
					{
						$(idVal).html(
							innerValue +
							" <div class='onclickBox' onclick='updateCell(\"" + index + innerIndex + "\")'></div>" +
							" <div class='hintBox tl' id='" + index + innerIndex + "tl' onclick='updateHint(\"" + index + innerIndex + "tl\")'></div>" +
							" <div class='hintBox tr' id='" + index + innerIndex + "tr' onclick='updateHint(\"" + index + innerIndex + "tr\")'></div>" +
							" <div class='hintBox bl' id='" + index + innerIndex + "bl' onclick='updateHint(\"" + index + innerIndex + "bl\")'></div>" +
							" <div class='hintBox br' id='" + index + innerIndex + "br' onclick='updateHint(\"" + index + innerIndex + "br\")'></div>"
						);
					}
				});
			});

			if (runCheck(true))
			{
				setup();
			}
		}

		function getRandomInt(min, max)
		{
			const minCeiled = Math.ceil(min);
			const maxFloored = Math.floor(max);
			return Math.floor(Math.random() * (maxFloored - minCeiled) + minCeiled);
		}

		function runCheck(isSetup)
		{
			$.each(theGridArr, function (index, value)
			{
				$.each(value, function (innerIndex, innerValue)
				{
					idVal = "#" + index + innerIndex;
					if ($(idVal).hasClass("nonInit"))
					{
						$(idVal).css("background-color", "grey");
					}
					else
					{
						$(idVal).css("background-color", "white");
					}
				});
			});
			var everyCheckCleared = true;
			var restartSetup = false;

			$.each(theGridArr, function (index, value)
			{
				var allSafe = true;
				var tested = [];
				$.each(value, function (innerIndex, innerValue)
				{
					if (innerValue == ' ')
					{
						everyCheckCleared = false;
					}
					else if (jQuery.inArray(innerValue, tested) != -1)
					{
						allSafe = false;
						everyCheckCleared = false;
						restartSetup = true;
					}
					else
					{
						tested.push(innerValue);
					}
				});

				if (allSafe == false)
				{
					$.each(value, function (innerIndex, innerValue)
					{
						var currentID = "#" + index + innerIndex;
						if ($(currentID).hasClass("nonInit"))
						{
							$(currentID).css("background-color", "darkRed");
						}
						else
						{
							$(currentID).css("background-color", "red");
						}
					});
				}
			});

			var arrTest = [];
			for (var vv = 0; vv < 3; vv = vv + 1)
			{
				for (var n = 0; n < 3; n = n + 1)
				{
					for (var aa = (0 + vv); aa < (9 + vv); aa = aa + 3)
					{
						for (var i = (0 + n); i < (9 + n); i = i + 3)
						{
							arrTest.push(["#"+aa+i,theGridArr[aa][i]]);
						}
					}
					var allSafe = true;
					var colTested = [];
					var coltempIDs = [];
					$.each(arrTest, function (index, value)
					{
						if (value[1] == ' ')
						{
							coltempIDs.push(value[0]);
							everyCheckCleared = false;
						}
						else if (jQuery.inArray(value[1], colTested) != -1)
						{
							allSafe = false;
							everyCheckCleared = false;
							restartSetup = true;
							coltempIDs.push(value[0]);
						}
						else
						{
							colTested.push(value[1]);
							coltempIDs.push(value[0]);
						}
					});
					if (allSafe == false)
					{
						$.each(coltempIDs, function (index, value)
						{
							if ($(value).hasClass("nonInit"))
							{
								$(value).css("background-color", "darkRed");
							}
							else
							{
								$(value).css("background-color", "red");
							}
						});
					}
					arrTest = [];
					var innerMod = innerMod + 1;
				}
			}

			var arrTest = [];
			for (var vv = 0; vv < 9; vv = vv + 3)
			{
				for (var n = 0; n < 9; n = n + 3)
				{
					for (var aa = (0 + vv); aa < (3 + vv); aa = aa + 1)
					{
						for (var i = (0 + n); i < (3 + n); i = i + 1)
						{
							arrTest.push(["#" + aa + i, theGridArr[aa][i]]);
						}
					}
					var allSafe = true;
					var colTested = [];
					var coltempIDs = [];
					$.each(arrTest, function (index, value)
					{
						if (value[1] == ' ')
						{
							coltempIDs.push(value[0]);
							everyCheckCleared = false;
						}
						else if (jQuery.inArray(value[1], colTested) != -1)
						{
							allSafe = false;
							everyCheckCleared = false;
							restartSetup = true;
							coltempIDs.push(value[0]);
						}
						else
						{
							colTested.push(value[1]);
							coltempIDs.push(value[0]);
						}
					});
					if (allSafe == false)
					{
						$.each(coltempIDs, function (index, value)
						{
							if ($(value).hasClass("nonInit"))
							{
								$(value).css("background-color", "darkRed");
							}
							else
							{
								$(value).css("background-color", "red");
							}
						});
					}
					arrTest = [];
					var innerMod = innerMod + 1;
				}
			}

			if (everyCheckCleared)
			{
				$("#isErr").html("Complete");
			}
			else
			{
				$("#isErr").html("Err");
			}

			if (isSetup)
			{
				return restartSetup;
			}
		}
	</script>
