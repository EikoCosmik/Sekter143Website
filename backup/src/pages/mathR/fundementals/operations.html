		Now that we have the absolute core in, let's talk about what most people likely think of as math. The operations!<br/>

	<sktemplate
		type="simpleContent"
		title="Addition / Plus / +"
		text="
		<div>The most core and likely easy to understand operation. When considering <math><mn>2</mn><mo>+</mo><mn>3</mn></math>, we can consider it like adding 1 to 2 three times: <math><mn>2</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>1</mn><mo>+</mo><mn>1</mn></math>.<br/>
		What addition is asking us to do is quite literraly: 'If these groups were together, how many things would there be in the new group?</div>
		<div class='purpleElement block'>This is usefull when combinging items. All aspects of math utalise addition, this is the most fundemental item.</div>
		"
		class="mathTopic greenElement"
	></sktemplate>
