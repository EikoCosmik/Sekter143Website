		title="My Thoughts / Opinions on current educational Maths"
		text=
		"
		I Love math.<br/>
		Sure, it's probably something in my brain that just likes logic and sequential step taking, but I refuse to get an expensive diagnosis that can't help me in life. Which is a separate issue for a different site category.<br /><br />
		I think we all see a similar question in life: “are you a math person or are you an English person?” (or fill in the English to be your “Language and Literature” subject), and I think it's a massive shame that this seems to of become the common outlook on this. Both subjects are valuable in their own ways. Yes, I may also have a bias of not being a “Language and Literature” fan, but I am also able to acknowledge the potential value in those subjects. My issue and my opinion when we look at the divide like this is that we assume an inherent truth in our beings rather than something not being fulfilled when one was taught.<br /><br />
		I think another thing you may have heard is “People who understand math, understand because they have/had a great teacher”. I believe there is truth here, but not as simple good vs bad. Rather we also must acknowledge that teachers must teach Every student in their class, unfortunately they do have to go with a more general approach. (And also, being stuck with certain learning outcomes as dictated by a board is also a potential issue, but I'm not qualified, so I won't say).<br /><br />
		In my opinion, that I am arriving from stepping back and observing the world, Math is essential in modern day life. But is taught in a less optimal way per student due to time and resource restrictions that leads to disinterest and confusion.<br />
		So that's my goal, I want to start with the barebones basics and build up these fundamentals again from the start, dive into some of the why, and see if I can unpick some confusion in how math works. (And I do mean fundamentals from the start; first real post is counting)<br /><br />
		That being said, i will caveat one thing:<br />
		I am educated up to a certain point; I have looked at a lot of interesting topics and follow a lot of math / science creators because of a genuine interest. However, my actual applied educated level is somewhere within the standard High School / related subject University level. I'm not a math student, I'm an IT / ComSci student. Whilst math is involved, the “Math for Computer Science” subject was not a “Core mathematics” style of subject, more a side branch.<br /><br />
		That being said, I do believe I can help. I do believe I have a perspective that can help. And most importantly, I genuinely believe with the correct guidance and explanation of why certain topics are useful, anyone can understand why math is so important, and that anyone can learn it.
		<br/><br />
		In future posts / topics, I plan to include guides on what's core and what's explanatory. You may have seen in the sidebar of main index the color Key, that will be for the topics in general. I'll make sure to append something to the bottom of each page as a guide to colors in individual topics. If I am diving into topics and exploring things in a 'not out of order but not required yet' style, it's best to make sure we are all on the same level of understanding.
		"
