		<sktemplate
			id="EKCO000000"
			type="standardPost"
			title="Where should they start?"
			text=
			"
			<div>Does it make sense to even ask? I mean how many points make sense? Does it even make sense again to ask about is it worth starting from a point that makes sense?<br /><br />
			Ok let's see where would work:<br />
				<ol>
					<li>How about the literal beginning before Dawn?<br/>No, that's not a great choice, too esoteric with context best explained after some time with the regular events.</li>
					<li>What about just after Dawn?<br/>No, the beginning of Aelveyris requires Dawn context.</li>
					<li>Then start in Dawn?<br/>Not too many characters are better shown later on.</li>
					<li>Skip it all and start with Dusk?<br/>Not starting with the end just doesn't feel right. Plus, Dusk holds too much.</li>
					<li>TLS was kind of the beginning to them, why not there?<br/>If they did, we would still need to narrow further, and it does also feel more disconnected now.</li>
					<li>Would anywhere be satisfying for everyone?<br/>Of course not, everyone is different.</li>
					<li>Then why does it matter?<br/>It truly didn't matter; all that mattered was some start.</li>
				</ol>
				Even if the start was from a character, no one will hear from for a long time. Even if this won't make sense for a long time. Even if no one cares.<br />
				It's at least started now.
			</div>
			"
			links="EKCO"
			class="purpleElement"
			date="2026-08-13"
			pageURL="https://sekter143.com/pages/sekter143"
			category="sekterPost"
		></sktemplate>

			text="The sun rises, we try again. Darkest before the Dawn. How do I eplain this creation I myself derive from. They were my parts, My Exiles, My Managers, My Firefighters.<br/>That wasent the plan, i didnt know what i was doing purely by accident. Whilst helpful now... the story exists and i must tell it.<br/>I know the story, but to tell it in a way im capeable of, it will feel very scattered."
			class="greyElement"
