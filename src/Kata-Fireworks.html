<pageSettings>
	title="KataFireworks"
	class="redElement"
	id="Kata-Fireworks"
</pageSettings>

<section id="pageContent" class="verticalTabs">
	<script src="/assets/kataAssets/Kata-Fireworks/Kata-Fireworks.js"></script>
	<div id="mainContainer">
		<div id="notify">Interact to enable sound!<br />- Hover bottom left for controls!<br />- Hover top left for
			exit.<br />V1</div>
		<canvas id="mainCanvas" width="2600" height="1400"></canvas>
		<div id="controls">
			<div class="inputBlock"><label>Spawn Interval</label><input type="number" value="250" id="spawnIntInput"
					step="1"></div>
			<div class="inputBlock"><label>Part Mod</label><input type="number" value="500" id="partModInput" step="1">
			</div>
			<div class="inputBlock"><label>volume</label><input type="number" id="volume" name="volume" min="0" max="1"
					value="0.05" step="0.01"></div>
			<div class="block tabs" id="dataOut"><button class="button" onclick="dispalyData = !dispalyData">Show dT &
					Count</button>
				<div class="block darkElement" id="deltaTOut"></div>
				<div class="block darkElement" id="partCountOut"></div>
				<div class="block darkElement" id="partCountPercentOut"></div>
			</div>
		</div>
	</div>
</section>
