	title="Guestbook!"

	<style>
		#emojiBlock {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			width: 550px;
			height: 350px;
			overflow-y: scroll;
			display: grid;
			grid-template-columns: 1fr;
			grid-auto-rows: min-content;
			grid-gap: var(--quarterGap);
			padding: var(--quarterGap);
		}
	
		#emojiBlock div {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			grid-template-rows: min-content;
			grid-auto-rows: 1fr;
			grid-gap: var(--quarterGap);
		}
	
		#emojiBlock div .button {
			display: grid;
			grid-template-columns: 1fr;
			grid-template-rows: min-content min-content;
			grid-template-areas: unset;
			grid-gap: var(--minGap);
			padding: var(--quarterGap);
		}
	
		#emojiBlock div h4 {
			grid-column: 1/-1;
		}
	</style>
