<pageSettings>
	title="The BAD"
	class="redElement badHorseRace"
	id="BAD"
</pageSettings>

<section id="pageContent" class="tabs">
	<div id="imagePlaceholder" style="display: none;">
		<img id="redHorseImage" src="../../assets/images/BAD/RedHorse.png">
		<img id="greenHorseImage" src="../../assets/images/BAD/GreenHorse.png">
		<img id="blueHorseImage" src="../../assets/images/BAD/BlueHorse.png">
		<img id="yellowHorseImage" src="../../assets/images/BAD/YellowHorse.png">
		<img id="trackImage" src="../../assets/images/BAD/track.png">
	</div>
	<canvas id="badPaintCanvas" width="1000" height="400"></canvas>
	<div id="pastScroll">
		<div id="pasts">
			<span id="goal">Goal - Beat the House, Take all their money.</span>
		</div>
	</div>
	<div id="bankingBlock">
		<form id="checkboxes">
			<div class="redCheckbox">
				<input type="checkbox" name="horse" value="red" id="red" />
				<div onclick="$('#checkboxes .redCheckbox input').click()" class="checkmark">R</div>
			</div>
			<div class="greenCheckbox">
				<input type="checkbox" name="horse" value="green" id="green" />
				<div onclick="$('#checkboxes .greenCheckbox input').click()" class="checkmark">G</div>
			</div>
			<div class="blueCheckbox">
				<input type="checkbox" name="horse" value="blue" id="blue" />
				<div onclick="$('#checkboxes .blueCheckbox input').click()" class="checkmark">B</div>
			</div>
			<div class="yellowCheckbox">
				<input type="checkbox" name="horse" value="yellow" id="yellow" />
				<div onclick="$('#checkboxes .yellowCheckbox input').click()" class="checkmark">Y</div>
			</div>
		</form>
		<div id="money" class="darkElement">
			<article class="simpleContent greenElement">
				<h2>Bank:</h2>
				<section id="bank"></section>
			</article>
			<article class="simpleContent redElement">
				<h2>House:</h2>
				<section id="house"></section>
			</article>
			<article class="simpleContent blueElement">
				<h2>Bet:</h2><input type="number" step="1" id="betAmmount" value="1" />
			</article>
			<button id="rumButton" class="button greenElement" onclick="place()">Race</button>
		</div>
	</div>
	<sktemplate  type="simpleContent" title="BAD-HorseRace"
		text="So I work in the sports/race betting industry, this was my little go at a small simulator. Its just a fun little time. The horses get a randomized move distance each frame, first to pass a certain Y wins. It is quite simple, the only 'complex' thing was the transaction history. But that was a limitation of my knowledge at the time, now its a pretty simple task with backticks.">
	</sktemplate>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
	<script>
		var ready = false;
		$(window).on('load', function () {
			drawTrack();
			initHorse();
			initBank();
			ready = true;
		});

		var runs = 0;
		var endMet = false;
		var millMet = false;
		var bank = 100;
		var house = 900;
		var currentSelection = [];
		var currentBet = 0;
		var returnMulti = 0;
		var raceActive = false;

		const fixValue = new Intl.NumberFormat('en-US', {
			minimumFractionDigits: 2,
			maximumFractionDigits: 2,
		});

		function initBank() {
			updateMoney();
		}

		function updateMoney() {
			$("#bank").html("$" + fixValue.format(bank));
			$("#house").html("$" + fixValue.format(house));
		}

		function place() {
			if (ready) {
				if (!raceActive) {
					raceActive = true;
					currentSelection = [];
					if ($('#red').is(':checked')) {
						currentSelection.push(0);
					}
					if ($('#green').is(':checked')) {
						currentSelection.push(1);
					}
					if ($('#blue').is(':checked')) {
						currentSelection.push(2);
					}
					if ($('#yellow').is(':checked')) {
						currentSelection.push(3);
					}

					currentBet = parseFloat($("#betAmmount").val());
					if (decimalPlaces(currentBet) > 2) {
						alert("Invalid Bet Amount: 2 Decimals only.");
						raceActive = false;
					}
					else if (currentBet <= 0)
					{
							alert("Invalid Bet Amount: Cannot bet a negative number or 0.");
							raceActive = false;
						}
						else if (currentSelection.length == 0) {
								alert("Please select at least one option.");
								raceActive = false;
							}
							else {
								if (currentBet > bank) {
									alert("Current Bet to High");
									raceActive = false;
								}
								else {
									switch (currentSelection.length) {
										case 1:
											returnMulti = 4;
											break;
										case 2:
											returnMulti = 2;
											break;
										case 3:
											returnMulti = 1.33;
											break;
										case 4:
											returnMulti = 1;
											break;
									}

									bank = parseFloat(fixValue.format(bank - currentBet).replace(/,/g, ''));
									house = house + currentBet;
									house = fixValue.format(house).replace(/,/g, '');
									house = parseFloat(house);
									updateMoney();
									generatePast(null, "Bet", null);
									runs = runs + 1;
									raceInit();
								}
							}
				}
			}
			else {
				alert("Page Loading, Please Wait");
			}
		}

		function generateRandom() {
			if (!generateRandom.prevNums) {
				generateRandom.prevNums = {};
			}
			var random;
			do {
				random = Math.floor((Math.random() * (99999999 - 10000000 + 1)) + 10000000);
			} while (generateRandom.prevNums[random])
			generateRandom.prevNums[random] = true;
			return (random.toString());
		}

		function generatePast(change, condition, winner) {
			var seed = generateRandom();
			var horseName;
			var horseColor;
			switch (currentSelection[0]) {
				case 0:
					horseName = "Red";
					horseColor = "darkRed";
					break;
				case 1:
					horseName = "Green";
					horseColor = "darkGreen";
					break;
				case 2:
					horseName = "Blue";
					horseColor = "darkBlue";
					break;
				case 3:
					horseName = "Yellow";
					horseColor = "darkgoldenrod";
					break;
			}
			var winName;
			var winColor;
			switch (winner) {
				case 0:
					winName = "Red";
					winColor = "darkRed";
					break;
				case 1:
					winName = "Green";
					winColor = "darkGreen";
					break;
				case 2:
					winName = "Blue";
					winColor = "darkBlue";
					break;
				case 3:
					winName = "Yellow";
					winColor = "darkgoldenrod";
					break;
			}
			var newSelection = selectionToNames(currentSelection);
			change = fixValue.format(change);

			switch (condition) {
				case "Win":
					$("#pasts").prepend(`<div class='pastWin' id='${seed}'></div>`);
					$("#pasts #" + seed).append(`<div id="pastResult">Return Ticket:</div>`);
					$("#pasts #" + seed).append(`<div class="${winName}">${winName} Win</div>`);
					$("#pasts #" + seed).append(`<div id="pastBetSelection">Select: ${newSelection}</div>`);
					$("#pasts #" + seed).append(`<div id="pastWin">Win</div>`);
					$("#pasts #" + seed).append(`<div id="pastBA">Bank + $${change}</div>`);
					$("#pasts #" + seed).append(`<div id="pastHA">House - $${change}</div>`);
					$("#pasts #" + seed).append(`<div id="pastBT">Bank = $${bank}</div>`);
					$("#pasts #" + seed).append(`<div id="pastHT">House = $${house}</div>`);
					break;
				case "Lost":
					$("#pasts").prepend(`<div class='pastLost' id='${seed}'></div>`);
					$("#pasts #" + seed).append(`<div id="pastResult">Return Ticket:</div>`);
					$("#pasts #" + seed).append(`<div class="${winName}">${winName} Win</div>`);
					$("#pasts #" + seed).append(`<div id="pastBetSelection">Select: ${newSelection}</div>`);
					$("#pasts #" + seed).append(`<div id="pastWin">Lost</div>`);
					$("#pasts #" + seed).append(`<div id="pastBT">Bank = ${bank}</div>`);
					$("#pasts #" + seed).append(`<div id="pastHT">House = ${house}</div>`);
					break;
				case "Bet":
					$("#pasts").prepend("<hr />");
					$("#pasts").prepend(`<div class='placePast' id='${seed}'></div>`);
					$("#pasts #" + seed).append(`<div id="pastResult">Place Ticket:</div>`);
					$("#pasts #" + seed).append(`<div id="pastBetSelection">Select: ${newSelection}</div>`);
					$("#pasts #" + seed).append(`<div id="pastBetAmount">Bank - $${currentBet}</div>`);
					$("#pasts #" + seed).append(`<div id="pastBT">Bank = ${bank}</div>`);
					$("#pasts #" + seed).append(`<div id="pastHT">House = ${house}</div>`);
					break;
			}
		}

		function selectionToNames(arrIn) {
			var arrOut = [];

			$.each(arrIn, function (index, value) {
				switch (value) {
					case 0:
						arrOut.push("R");
						break;
					case 1:
						arrOut.push("G");
						break;
					case 2:
						arrOut.push("B");
						break;
					case 3:
						arrOut.push("Y");
						break;
				}
			});

			return arrOut;
		}

		function raceFinished(winner) {
			if (winner == currentSelection[0] || winner == currentSelection[1] || winner == currentSelection[2] || winner == currentSelection[3]) {
				change = (currentBet * returnMulti);
				bank = parseFloat(fixValue.format(bank + change).replace(/,/g, ''));
				house = parseFloat(fixValue.format(house - change).replace(/,/g, ''));
				updateMoney();
				generatePast(change, "Win", winner);
			}
			else {
				generatePast(currentBet, "Lost", winner);
			}

			if (house < 0 && !endMet) {
				alert("Winner! You beat the house after " + runs + " attempts!");
				endMet = true;
			}
			if (bank <= 0 && !endMet) {
				alert("Whoops! The house won after " + runs + " attempts.");
				endMet = true;
			}
			if (bank >= 1000000 && !millMet) {
				alert("1mil reached, you can stop now.");
				millMet = true;
			}

			raceActive = false;
		}

		function decimalPlaces(num) {
			var match = ('' + num).match(/(?:\.(\d+))?(?:[eE]([+-]?\d+))?$/);
			if (!match) { return 0; }
			return Math.max(
				0,
				(match[1] ? match[1].length : 0)
				- (match[2] ? +match[2] : 0));
		}

		var startLine = 100;
		var spotOne = 50;
		var spotTwo = 150;
		var spotThree = 250;
		var spotFour = 350;
		var finishLine = 900;
		var fullHeight = 400;
		var fullWidth = 1000;
		var testing = false;
		var horseHeight = 50;
		var horseWidth = 100;
		var minSpeed = -1;
		var maxSpeed = 5;
		var raceSpeed = 5;

		const canvas = document.getElementById("badPaintCanvas");
		const ctx = canvas.getContext("2d");
		var horseOneLocation;
		var horseTwoLocation;
		var horseThreeLocation;
		var horseFourLocation;
		var raceInterval;

		function drawTrack() {
			ctx.clearRect(-10, -10, 1200, 500);
			if (testing) {
				drawTestDesign();
			}
			else {
				ctx.drawImage(document.getElementById("trackImage"), 0, 0, 1000, 400);
			}
		}

		function drawTestDesign() {
			ctx.moveTo(startLine, spotOne);
			ctx.lineTo(finishLine, spotOne);
			ctx.moveTo(startLine, spotTwo);
			ctx.lineTo(finishLine, spotTwo);
			ctx.moveTo(startLine, spotThree);
			ctx.lineTo(finishLine, spotThree);
			ctx.moveTo(startLine, spotFour);
			ctx.lineTo(finishLine, spotFour);
			ctx.moveTo(startLine, 0);
			ctx.lineTo(startLine, fullHeight);
			ctx.moveTo(finishLine, 0);
			ctx.lineTo(finishLine, fullHeight);
			ctx.stroke();
		}

		function initHorse() {
			ctx.drawImage(document.getElementById("redHorseImage"), startLine - horseWidth, spotOne - (horseHeight / 2), horseWidth, horseHeight);
			ctx.drawImage(document.getElementById("greenHorseImage"), startLine - horseWidth, spotTwo - (horseHeight / 2), horseWidth, horseHeight);
			ctx.drawImage(document.getElementById("blueHorseImage"), startLine - horseWidth, spotThree - (horseHeight / 2), horseWidth, horseHeight);
			ctx.drawImage(document.getElementById("yellowHorseImage"), startLine - horseWidth, spotFour - (horseHeight / 2), horseWidth, horseHeight);
		}

		function drawRace() {
			drawTrack();
			ctx.drawImage(document.getElementById("redHorseImage"), horseOneLocation - horseWidth, spotOne - (horseHeight / 2), horseWidth, horseHeight);
			ctx.drawImage(document.getElementById("greenHorseImage"), horseTwoLocation - horseWidth, spotTwo - (horseHeight / 2), horseWidth, horseHeight);
			ctx.drawImage(document.getElementById("blueHorseImage"), horseThreeLocation - horseWidth, spotThree - (horseHeight / 2), horseWidth, horseHeight);
			ctx.drawImage(document.getElementById("yellowHorseImage"), horseFourLocation - horseWidth, spotFour - (horseHeight / 2), horseWidth, horseHeight);
		}

		function raceInit() {
			horseOneLocation = startLine;
			horseTwoLocation = startLine;
			horseThreeLocation = startLine;
			horseFourLocation = startLine;
			raceInterval = setInterval(raceSim, raceSpeed);
		}

		function generateRandomSpeed() {
			return (minSpeed + Math.random() * maxSpeed);
		}

		function raceSim() {
			var horseTestArr = [horseOneLocation, horseTwoLocation, horseThreeLocation, horseFourLocation];

			horseOneLocation = horseOneLocation + generateRandomSpeed();
			horseTwoLocation = horseTwoLocation + generateRandomSpeed();
			horseThreeLocation = horseThreeLocation + generateRandomSpeed();
			horseFourLocation = horseFourLocation + generateRandomSpeed();

			drawRace();

			if (largest(horseTestArr) >= finishLine) {
				clearInterval(raceInterval);
				raceFinished(horseTestArr.indexOf(largest(horseTestArr)));
			}
		}

		function largest(arr) {
			let i;
			let max = arr[0];

			for (i = 1; i < arr.length; i++) {
				if (arr[i] > max)
					max = arr[i];
			}

			return max;
		}
	</script>
</section>
